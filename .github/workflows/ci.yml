name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # Full checkout for non-Windows platforms
    - uses: actions/checkout@v4
      if: matrix.os != 'windows-latest'

    # Sparse checkout on Windows to avoid reserved filenames (aux, con)
    # in the Plan 9 source tree that NTFS cannot represent
    - uses: actions/checkout@v4
      if: matrix.os == 'windows-latest'
      with:
        sparse-checkout: |
          CMakeLists.txt
          include
          test
          tests
          .github

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --config Debug

    - name: Run Tests
      run: ctest --test-dir build -C Debug --output-on-failure

    - name: Run CLI Tests
      if: runner.os != 'Windows'
      run: |
        chmod +x tests/cli/test_cogctl.sh
        chmod +x tests/cli/test_cogfs.sh
        ./tests/cli/test_cogctl.sh
        ./tests/cli/test_cogfs.sh

    - name: Run E2E Tests
      if: runner.os != 'Windows'
      run: |
        chmod +x tests/e2e/test_full_workflow.sh
        ./tests/e2e/test_full_workflow.sh
